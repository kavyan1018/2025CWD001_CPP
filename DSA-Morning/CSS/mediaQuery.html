<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body{
    padding: 1rem 5rem;
}

.container{
    display: flex;
    justify-content: space-between;
}


.boxes{
    height: 200px;
    width: 200px;
    background-color: lightgreen;
    border: solid green;
    font-size: 1.5rem;
    font-family: cursive;
    font-weight: 600;
    text-align: center;
    padding-top: 80px;
}

@media(max-width: 1350px){

    /* width  -> 400px */

    .boxes{
        height: 150px;
        width: 150px;
        padding-top: 55px;
    }
}
@media(max-width: 750px){

    /* width  -> 400px */

    .boxes{
        height: 100px;
        width: 100px;
        padding-top: 40px;
    
    
        background-color: hotpink;
        font-size: 1rem;
        border-radius: 30px;
        margin: 10px;

    }
}


@media(max-width: 441px){

    /* width  -> 400px */

    .container{
        display: block;
    }

    .boxes{
        
        /* display: inline-block; */
        padding: 30px;
        height: 200px;
        width: 200px;
        margin: 5px;
        font-size: 1.5rem;

    }
}

@media(max-width: 250px){

    /* width  -> 400px */

    .container{
        display: block;
    }

    .boxes{
        
        /* display: inline-block; */
        padding: 30px;
        height: 150px;
        width: 150px;
        margin: 5px;
        font-size: 1.5rem;

    }
}

</style>
<body>
    
    <div class="container">

        <div class="boxes" id="box1">Box 1</div>
        <div class="boxes" id="box2">Box 2</div>
        <div class="boxes" id="box3">Box 3</div>
        <div class="boxes" id="box4">Box 4</div>
        <div class="boxes" id="box5">Box 5</div>
        <div class="boxes" id="box6">Box 6</div>

    </div>

</body>
</html>
